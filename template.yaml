AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: spin-transactions write and read services on ECS Fargate

Parameters:
  DeployServices:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: false crea red, RDS, ECR y el ALB. true también crea los dos servicios ECS. La imagen tiene que existir en ECR antes.
  ImageTag:
    Type: String
    Default: latest
    Description: Tag de la imagen en el repositorio ECR de este stack.
  ProviderBaseUrl:
    Type: String
    Default: https://em4d4.wiremockapi.cloud
    Description: Base URL del PSP. El servicio escribe en POST /provider/v1/execute.
  ProviderApiKey:
    Type: String
    NoEcho: true
    Default: demo-api-key
    Description: API key que el servicio de escritura envía al PSP.

Conditions:
  CreateEcsServices: !Equals [!Ref DeployServices, "true"]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-b

  PublicSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress HTTP
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks from the ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Postgres from ECS tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: spin-transactions
      SubnetIds:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${AWS::StackName}-pg
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageEncrypted: true
      DBName: transactions
      MasterUsername: txadmin
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup

  ProviderSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-provider-api-key
      SecretString: !Ref ProviderApiKey

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${AWS::StackName}
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${AWS::StackName}

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadAppSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref ProviderSecret
                  - !GetAtt DBInstance.MasterUserSecret.SecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  WriteLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}/write
      RetentionInDays: 14

  ReadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}/read
      RetentionInDays: 14

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: application/json
            MessageBody: '{"error":"not found"}'

  WriteTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: CreateEcsServices
    Properties:
      VpcId: !Ref VPC
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  ReadTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: CreateEcsServices
    Properties:
      VpcId: !Ref VPC
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  WriteListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: CreateEcsServices
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/transactions"]
        - Field: http-request-method
          HttpRequestMethodConfig:
            Values: ["POST"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref WriteTargetGroup

  ReadListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: CreateEcsServices
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/transactions"]
        - Field: http-request-method
          HttpRequestMethodConfig:
            Values: ["GET"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ReadTargetGroup

  WriteTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: CreateEcsServices
    Properties:
      Family: !Sub ${AWS::StackName}-write
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub "${EcrRepository.RepositoryUri}:${ImageTag}"
          Command: ["/write"]
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: HTTP_ADDR
              Value: ":8080"
            - Name: GIN_MODE
              Value: release
            - Name: RUN_MIGRATIONS
              Value: "true"
            - Name: PROVIDER_BASE_URL
              Value: !Ref ProviderBaseUrl
            - Name: DB_HOST
              Value: !GetAtt DBInstance.Endpoint.Address
            - Name: DB_PORT
              Value: "5432"
            - Name: DB_USER
              Value: txadmin
            - Name: DB_NAME
              Value: transactions
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Join
                - ""
                - - !GetAtt DBInstance.MasterUserSecret.SecretArn
                  - ":password::"
            - Name: PROVIDER_API_KEY
              ValueFrom: !Ref ProviderSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WriteLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: write

  ReadTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: CreateEcsServices
    Properties:
      Family: !Sub ${AWS::StackName}-read
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub "${EcrRepository.RepositoryUri}:${ImageTag}"
          Command: ["/read"]
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: HTTP_ADDR
              Value: ":8080"
            - Name: GIN_MODE
              Value: release
            - Name: DB_HOST
              Value: !GetAtt DBInstance.Endpoint.Address
            - Name: DB_PORT
              Value: "5432"
            - Name: DB_USER
              Value: txadmin
            - Name: DB_NAME
              Value: transactions
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Join
                - ""
                - - !GetAtt DBInstance.MasterUserSecret.SecretArn
                  - ":password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ReadLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: read

  WriteService:
    Type: AWS::ECS::Service
    Condition: CreateEcsServices
    DependsOn: WriteListenerRule
    Properties:
      ServiceName: !Sub ${AWS::StackName}-write
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 60
      TaskDefinition: !Ref WriteTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref WriteTargetGroup
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

  ReadService:
    Type: AWS::ECS::Service
    Condition: CreateEcsServices
    DependsOn: ReadListenerRule
    Properties:
      ServiceName: !Sub ${AWS::StackName}-read
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 60
      TaskDefinition: !Ref ReadTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref ReadTargetGroup
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

Outputs:
  LoadBalancerDNS:
    Description: DNS del ALB. POST /transactions va a write y GET /transactions va a read.
    Value: !GetAtt LoadBalancer.DNSName
  EcrRepositoryUri:
    Description: URI del repositorio. Publica la imagen aquí antes de DeployServices=true.
    Value: !GetAtt EcrRepository.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
